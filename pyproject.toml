[project]
name = "kindle-export-explorer"
version = "0.1.0"
description = "Explore and reconstruct an Amazon Kindle data export"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.4.2",
]

[project.scripts]
kindle-export-explorer = "kindle_export_explorer.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
typeCheckingMode = "strict"
# Pyright's type propagation through dataclasses.field requires contextually typed
# lambdas instead of bare collection factories (for example, lambda: [] vs. list).
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    "**/.venv",
    "scratch",
]
