[project]
name = "kindle-export-explorer"
version = "0.1.0"
description = "Explore and reconstruct an Amazon Kindle data export"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.4.2",
]

[project.scripts]
kindle-export-explorer = "kindle_export_explorer.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "isort>=9.0.1",
    "pre-commit>=4.6.2",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 88

[tool.isort]
# Ruff's formatter follows Black's style; keep import wrapping compatible.
profile = "black"
line_length = 88
skip_gitignore = true

[tool.ruff.lint]
extend-select = ["D100"]
ignore = [
    "I001",   # import sorting is enforced by isort
    "PIE807", # allows `lambda: []` for pyright
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100"]

[tool.pyright]
typeCheckingMode = "strict"
# Pyright's type propagation through dataclasses.field requires contextually typed
# lambdas instead of bare collection factories (for example, lambda: [] vs. list).
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    "**/.venv",
    "scratch",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.kindle-export-explorer.file-io-boundaries]
source-roots = ["src/kindle_export_explorer"]
allowed-reads = [
    "kindle_export_explorer.acquisitions:reconstruct_acquisitions",
    "kindle_export_explorer.books:ExportFiles.__init__",
    "kindle_export_explorer.books:normalize_sharded_path",
    "kindle_export_explorer.books:reconstruct_books",
    "kindle_export_explorer.cli.resolve_reading:_prompt_status",
    "kindle_export_explorer.reading:reconstruct_reading",
    "kindle_export_explorer.resolutions:load_resolutions",
]
