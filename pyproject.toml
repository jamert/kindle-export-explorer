[project]
name = "kindle-export-explorer"
version = "0.1.0"
description = "Explore and reconstruct an Amazon Kindle data export"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.4.2",
]

[project.scripts]
kindle-export-explorer = "kindle_export_explorer.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
]
