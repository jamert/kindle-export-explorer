[project]
name = "kindle-export-reassembly"
version = "0.1.0"
description = "Reconstruct canonical books from an Amazon Kindle data export"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.4.2",
]

[project.scripts]
kindle-books = "kindle_export_reassembly.cli:main"
kindle-reading = "kindle_export_reassembly.reading_cli:main"
kindle-export-reassembly = "kindle_export_reassembly.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
]
