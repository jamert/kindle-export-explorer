repos:
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: env -u KINDLE_EXPORT_PATH uv run pytest
        language: system
        pass_filenames: false
        always_run: true
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        pass_filenames: false
        always_run: true
      - id: isort
        name: isort
        entry: uv run isort --check-only --diff .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        pass_filenames: false
        always_run: true
